name: Build Windows

# 只手动触发，不在 push 时自动跑（避免每次提交都烧 Actions 额度）
on:
    workflow_dispatch:
        inputs:
            target:
                description: 'Rust target to build'
                required: true
                default: 'x86_64-pc-windows-msvc'
                type: choice
                options:
                    - x86_64-pc-windows-msvc
                    - aarch64-pc-windows-msvc

permissions:
    contents: write

jobs:
    build:
        runs-on: windows-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ inputs.target }}

            # Rust 全量编译首次约 20-30 分钟，缓存后 3-5 分钟
            - name: Rust Cache
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Install Dependencies
              run: pnpm install --no-frozen-lockfile

            # 不构建 updater bundle，因此不需要 TAURI_PRIVATE_KEY
            - name: Build and Package
              run: pnpm tauri build -b nsis --target ${{ inputs.target }}

            - name: Upload Artifact
              uses: actions/upload-artifact@v4
              with:
                  name: pot-windows-${{ inputs.target }}
                  path: src-tauri/target/${{ inputs.target }}/release/bundle/nsis/*.exe
                  if-no-files-found: error

            # 只有手动打 tag（如 git tag v3.0.7-my1 && git push --tags）才会创建 Release
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags/v')
              uses: softprops/action-gh-release@v1
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ inputs.target }}/release/bundle/nsis/*.exe
